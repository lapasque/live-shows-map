<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte des Tournées - Humoristes (France, Benelux & Suisse)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS pour la carte interactive -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Style interne -->
    <link rel="stylesheet" href="assets/css/styles.css">

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- En-tête -->
    <header class="bg-slate-950 border-b border-slate-800 px-4 py-3 sm:px-6 flex flex-col md:flex-row md:items-center md:justify-between gap-3 z-20 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center text-slate-950 font-extrabold text-xl shadow-md shrink-0">
                <i class="fa-solid fa-microphone-lines"></i>
            </div>
            <div>
                <div class="flex flex-wrap items-center gap-2">
                    <span id="artistSelectLabel" class="sr-only">Choisir un artiste</span>
                    <div id="artistPicker" class="relative">
                        <button id="artistDropdownToggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="artistDropdownMenu" aria-labelledby="artistSelectLabel selectedArtistName"
                            class="bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-base sm:text-lg tracking-tight pl-2 pr-3 py-1 rounded-xl border border-slate-700 focus:outline-none focus:border-amber-400 cursor-pointer transition shadow-sm flex items-center gap-2">
                            <span id="selectedArtistImage" class="h-9 w-9 shrink-0 overflow-hidden rounded-lg bg-slate-800 flex items-center justify-center">
                                <i class="fa-solid fa-masks-theater text-amber-400"></i>
                            </span>
                            <span id="selectedArtistName">Chargement...</span>
                            <i class="fa-solid fa-chevron-down text-amber-400 text-xs ml-1"></i>
                        </button>
                        <div id="artistDropdownMenu" role="listbox" aria-labelledby="artistSelectLabel" class="hidden absolute left-0 top-full z-50 mt-2 min-w-full w-max max-w-xs overflow-hidden rounded-xl border border-slate-700 bg-slate-950 shadow-xl"></div>
                    </div>
                    <span class="text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full">France, Benelux & Suisse</span>
                </div>
                <p id="artistSubtitle" class="text-xs text-slate-400 mt-0.5"></p>
            </div>
        </div>

        <!-- Filtres et légende -->
        <div class="flex flex-wrap items-center gap-2 text-xs">
            <button data-filter="all" id="btn-all" class="filter-btn active px-3 py-1.5 rounded-lg font-semibold bg-white text-slate-900 shadow transition cursor-pointer">
                Toutes (<span id="count-all">0</span>)
            </button>
            <button data-filter="dispo" id="btn-dispo" class="filter-btn px-3 py-1.5 rounded-lg font-semibold bg-blue-600/20 text-blue-300 border border-blue-500/40 hover:bg-blue-600/30 transition flex items-center gap-1.5 cursor-pointer">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-500 inline-block"></span> Places dispo (<span id="count-dispo">0</span>)
            </button>
            <button data-filter="dernieres" id="btn-dernieres" class="filter-btn px-3 py-1.5 rounded-lg font-semibold bg-amber-600/20 text-amber-300 border border-amber-500/40 hover:bg-amber-600/30 transition flex items-center gap-1.5 cursor-pointer">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span> Dernières places (<span id="count-dernieres">0</span>)
            </button>
            <button data-filter="complet" id="btn-complet" class="filter-btn px-3 py-1.5 rounded-lg font-semibold bg-red-600/20 text-red-300 border border-red-500/40 hover:bg-red-600/30 transition flex items-center gap-1.5 cursor-pointer">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span> Complet (<span id="count-complet">0</span>)
            </button>
        </div>
    </header>

    <!-- Contenu principal : Carte + Liste latérale -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">
        
        <!-- Carte interactive -->
        <div class="relative flex-1 h-[58vh] lg:h-[calc(100vh-73px)]">
            <div id="map" class="w-full h-full z-10 bg-slate-200"></div>
            
            <!-- Boutons de zoom rapide (Vue d'ensemble / Benelux / Suisse / Île-de-France) -->
            <div class="absolute bottom-5 left-4 z-[1000] flex flex-wrap gap-2">
                <button data-view="france" class="bg-slate-900/90 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-2 rounded-xl border border-slate-700 shadow-lg backdrop-blur flex items-center gap-1.5 cursor-pointer transition">
                    <i class="fa-solid fa-map text-amber-400"></i> Vue d'ensemble
                </button>
                <button data-view="benelux" class="bg-slate-900/90 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-2 rounded-xl border border-slate-700 shadow-lg backdrop-blur flex items-center gap-1.5 cursor-pointer transition">
                    <i class="fa-solid fa-flag text-emerald-400"></i> Zoom Benelux
                </button>
                <button data-view="suisse" class="bg-slate-900/90 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-2 rounded-xl border border-slate-700 shadow-lg backdrop-blur flex items-center gap-1.5 cursor-pointer transition">
                    <i class="fa-solid fa-mountain text-rose-400"></i> Zoom Suisse
                </button>
                <button data-view="paris" class="bg-slate-900/90 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-2 rounded-xl border border-slate-700 shadow-lg backdrop-blur flex items-center gap-1.5 cursor-pointer transition">
                    <i class="fa-solid fa-magnifying-glass-plus text-blue-400"></i> Zoom Île-de-France
                </button>
            </div>
        </div>

        <!-- Panneau latéral des dates -->
        <aside class="w-full lg:w-96 bg-slate-900 border-t lg:border-t-0 lg:border-l border-slate-800 flex flex-col h-[42vh] lg:h-[calc(100vh-73px)] z-20">
            <div class="p-3 border-b border-slate-800 bg-slate-950/60 space-y-3">
                <!-- Barre de sélection temporelle (curseur double) -->
                <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-2.5">
                    <div class="flex items-center justify-between text-[11px] mb-1">
                        <span class="font-semibold text-slate-300 flex items-center gap-1.5">
                            <i class="fa-regular fa-clock text-amber-400"></i> Période :
                        </span>
                        <div class="flex items-center gap-2">
                            <span id="timeRangeLabel" class="font-bold text-amber-300 bg-amber-500/10 border border-amber-500/30 px-2 py-0.5 rounded-md">
                            </span>
                            <button id="resetTimeBtn" class="hidden text-[10px] text-slate-400 hover:text-white underline cursor-pointer" title="Réinitialiser la période">
                                Tout
                            </button>
                        </div>
                    </div>
                    <div class="dual-range-wrap">
                        <div class="dual-range-track"></div>
                        <div id="rangeFill" class="dual-range-fill" style="left: 0%; width: 0%;"></div>
                        <input type="range" id="rangeStart" min="0" max="0" value="0" step="1" class="dual-range-input">
                        <input type="range" id="rangeEnd" min="0" max="0" value="0" step="1" class="dual-range-input">
                    </div>
                    <div id="sliderTicks" class="flex justify-between text-[9px] text-slate-400 font-medium px-0.5 -mt-0.5"></div>
                </div>

                <!-- Recherche textuelle -->
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="Rechercher une ville ou une salle..."
                        class="w-full bg-slate-800 text-white placeholder-slate-400 text-xs rounded-xl pl-8 pr-3 py-2 border border-slate-700 focus:outline-none focus:border-amber-400">
                </div>
            </div>
            
            <div id="datesList" class="flex-1 overflow-y-auto p-3 space-y-2">
                <!-- Généré dynamiquement en JS -->
            </div>

            <div class="p-2.5 bg-slate-950 border-t border-slate-800 text-[11px] text-slate-400 flex items-center justify-between">
                <span id="sourceText"></span>
                <a id="sourceLink" target="_blank" rel="noopener noreferrer" class="text-amber-400 hover:underline font-semibold">
                    Billetterie officielle <i class="fa-solid fa-arrow-up-right-from-square ml-0.5"></i>
                </a>
            </div>
        </aside>

    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
